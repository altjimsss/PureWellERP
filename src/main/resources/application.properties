spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-store=true
spring.devtools.restart.enabled=true

# Allow local key=value config from a root .env file (optional).
spring.config.import=optional:file:.env[.properties]

# Ensure sessions use cookies only so URLs don't get ;jsessionid appended.
server.servlet.session.tracking-modes=cookie

# Use DB_* variables from root .env to avoid stale shell overrides.
# Supabase pooler requires username format: postgres.<project_ref>
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.aqyduzeoeugvpwnefvxb}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
